name: CI

on:
  push:
    branches: ["master", "main", "igor2"]
  pull_request:
    branches: ["master", "main", "igor2"]

  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode (full is the explicit release gate)
        type: choice
        options: [focused, affected, full]
        default: affected
      base:
        description: Local comparison ref
        default: igor2
        type: string


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: shellcheck — lint all shell scripts and BATS files
  # ────────────────────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck (repository audit)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on core/
        # SC2086: unquoted variables — many are intentional in Igor's dynamic dispatch.
        # SC1090/SC1091: source paths that are dynamic at runtime.
        # continue-on-error until the first batch-fix pass is complete.
        continue-on-error: true
        run: |
          find core/ -name "*.sh" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

      - name: Run shellcheck on modules/
        continue-on-error: true
        run: |
          find modules/ -name "*.sh" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

      - name: Run shellcheck on igor.sh
        continue-on-error: true
        run: |
          shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash \
            igor.sh

      - name: Run shellcheck on tests/
        continue-on-error: true
        run: |
          find tests/ -name "*.sh" -o -name "*.bats" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: ruff — lint Python files
  # ────────────────────────────────────────────────────────────────────────────
  ruff:
    name: Ruff (repository audit)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: shared local/CI runner. Ordinary events use affected validation,
  # which already lints every changed Python/shell file. Whole-repository lint
  # above is reserved for an explicit manual full audit.
  # ────────────────────────────────────────────────────────────────────────────
  tests:
    name: Validation (${{ inputs.mode || 'affected' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/validation-requirements.txt

      - name: Cache BATS downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: validation-npm-${{ runner.os }}-bats-1.13.0

      - name: Install validation tools
        run: |
          pip install -r tests/validation-requirements.txt
          npm install --global --prefix "$RUNNER_TEMP/validation-tools" bats@1.13.0
          echo "$RUNNER_TEMP/validation-tools/bin" >> "$GITHUB_PATH"
          missing=()
          command -v shellcheck >/dev/null || missing+=(shellcheck)
          command -v rg >/dev/null || missing+=(ripgrep)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Run shared validation harness
        env:
          VALIDATION_MODE: ${{ inputs.mode || 'affected' }}
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
        run: |
          extra=(--jobs 2 --fail-fast-preflight --interactive-timeout 60)
          if [ "$VALIDATION_MODE" != "full" ]; then
            extra+=(--group-timeout 240 --slow-timeout 300)
          fi
          tests/validate.sh "$VALIDATION_MODE" --base "$VALIDATION_BASE" --output-dir validation-results "${extra[@]}"

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ inputs.mode || 'affected' }}
          path: validation-results/
          if-no-files-found: warn
