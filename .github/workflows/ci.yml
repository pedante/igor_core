name: CI

on:
  push:
    branches: ["master", "main", "igor2"]
  pull_request:
    branches: ["master", "main", "igor2"]

  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode (full is the explicit release gate)
        type: choice
        options: [focused, affected, full]
        default: affected
      base:
        description: Local comparison ref
        default: igor2
        type: string

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: shellcheck — lint all shell scripts and BATS files
  # ────────────────────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on core/
        # SC2086: unquoted variables — many are intentional in Igor's dynamic dispatch.
        # SC1090/SC1091: source paths that are dynamic at runtime.
        # continue-on-error until the first batch-fix pass is complete.
        continue-on-error: true
        run: |
          find core/ -name "*.sh" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

      - name: Run shellcheck on modules/
        continue-on-error: true
        run: |
          find modules/ -name "*.sh" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

      - name: Run shellcheck on igor.sh
        continue-on-error: true
        run: |
          shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash \
            igor.sh

      - name: Run shellcheck on tests/
        continue-on-error: true
        run: |
          find tests/ -name "*.sh" -o -name "*.bats" | sort | xargs shellcheck \
            --severity=warning \
            --exclude=SC2086,SC1090,SC1091,SC2034 \
            --shell=bash

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: ruff — lint Python files
  # ────────────────────────────────────────────────────────────────────────────
  ruff:
    name: Ruff (Python lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: shared local/CI runner; ordinary events never select full.
  # ────────────────────────────────────────────────────────────────────────────
  tests:
    name: Validation (${{ inputs.mode || 'affected' }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install 'pytest>=9,<10' ruff
          npm install -g bats@1.13.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck

      - name: Run shared validation harness
        env:
          VALIDATION_MODE: ${{ inputs.mode || 'affected' }}
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before }}
        run: |
          tests/validate.sh "$VALIDATION_MODE" --base "$VALIDATION_BASE" --output-dir validation-results

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ inputs.mode || 'affected' }}
          path: validation-results/
          if-no-files-found: warn


  # Temporary focused proof for Result Publication Boundary E; removed after evidence.
  boundary_e:
    name: Result Publication Boundary E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused tools
        run: |
          pip install 'pytest>=9,<10'
          sudo npm install -g bats@1.13.0
      - name: Syntax
        run: |
          bash -n core/ai/events.sh
          bash -n core/ai/safety.sh
          bash -n core/lib/automation.sh
          python -m py_compile core/lib/automation_registry.py
      - name: Automation event fast path
        run: |
          python -m pytest -q tests/test_automation_registry.py \
            -k 'event_prefilter or event_callback or event_delivery_only_queues or validated_capability_event'
      - name: Frontend event sequence and publication
        run: |
          bats --filter 'sequence cache|payload cannot replace|event stream refuses' tests/core/test_ai_events.bats
          bats --filter 'terminal output event|local output event' tests/core/test_ai_safety_events.bats
      - name: Domain event bus
        run: bats tests/modules/test_domain_event_bus.bats
