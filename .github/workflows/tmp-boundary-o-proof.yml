name: tmp-boundary-o-proof
on:
  push:
    branches:
      - perf/system-configuration-consumer-fast-path-boundary-o
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Syntax
        run: |
          bash -n core/lib/configuration.sh
          bash -n core/lib/capability.sh
          bash -n core/lib/module_loader_fast.sh
          python -m py_compile core/lib/configuration.py modules/system/lib/memory_warning.py tests/test_configuration.py tests/test_system_configuration_workflow.py
      - name: Configuration contracts
        run: python -m pytest -q tests/test_configuration.py
      - name: System configuration workflow
        run: python -m pytest -q tests/test_system_configuration_workflow.py
      - name: Module and startup regressions
        run: |
          python tests/test_module_registration_timing.py
          python tests/test_ai_menu_startup.py
          python tests/test_ai_operator_backend.py
