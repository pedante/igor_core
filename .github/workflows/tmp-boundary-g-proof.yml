name: Boundary G proof

on:
  push:
    branches:
      - perf/tui-readiness-boundary-g

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'pytest>=9,<10'
      - name: Syntax
        run: |
          bash -n igor.sh
          bash -n core/ai/core.sh
          python -m py_compile core/ai/tui.py tests/test_ai_menu_startup.py tests/test_ai_tui.py
      - name: Boundary G readiness contracts
        run: |
          python -m pytest -q             tests/test_ai_menu_startup.py::AIMenuStartupTests::test_tui_reaches_input_ready_before_provider_or_context_preflight             tests/test_ai_menu_startup.py::AIMenuStartupTests::test_deferred_request_preparation_runs_provider_before_context_once             tests/test_ai_tui.py::EventProjectionTests::test_deferred_preflight_statuses_keep_backend_busy
      - name: Existing startup lifecycle
        run: |
          python -m pytest -q tests/test_ai_menu_startup.py
