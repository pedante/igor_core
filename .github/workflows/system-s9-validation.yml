name: S9 Stacked Validation

on:
  push:
    branches: ["feature/sys-cross-module-reuse"]

concurrency:
  group: system-s9-validation
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install 'pytest>=9,<10' ruff
          sudo npm install -g bats@1.13.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep

      - name: Focused S9 proof
        run: |
          bash -n modules/nextcloud_docker/lib/install/helpers.sh
          bash -n modules/nextcloud_docker/lib/install/start_stack.sh
          bash -n modules/nextcloud_docker/menus/install.sh
          shellcheck --severity=warning             --exclude=SC2086,SC1090,SC1091,SC2034             --shell=bash             modules/nextcloud_docker/lib/install/helpers.sh             modules/nextcloud_docker/lib/install/start_stack.sh             modules/nextcloud_docker/menus/install.sh             tests/modules/test_s9_cross_module_reuse.bats || true
          bats --tap tests/modules/test_s9_cross_module_reuse.bats
          pytest -q tests/test_validation_domains.py
          git diff --check origin/feature/sys-broader-catalogue...HEAD

      - name: Run S9 affected validation against stacked S8 base
        run: |
          git fetch origin feature/sys-broader-catalogue
          tests/validate.sh affected             --base origin/feature/sys-broader-catalogue             --output-dir validation-results             --fail-fast-preflight             --interactive-timeout 60             --group-timeout 240             --slow-timeout 300

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s9-stacked-validation
          path: validation-results/
          if-no-files-found: warn
