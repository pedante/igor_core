name: S7 Stacked Validation
# Temporary stacked S7 gate; remove after S7 closes.

on:
  push:
    branches: ["feature/sys-network-wifi"]

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install 'pytest>=9,<10' ruff
          sudo npm install -g bats@1.13.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep

      - name: Run focused S7.4 admission proof
        run: |
          bats --tap --timing tests/modules/test_system_network_wifi_admin.bats
