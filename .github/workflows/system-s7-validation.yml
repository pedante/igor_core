name: S7 Stacked Validation
# Temporary stacked S7 gate; remove after S7 closes.

on:
  push:
    branches: ["feature/sys-network-wifi"]

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install 'pytest>=9,<10' ruff
          sudo npm install -g bats@1.13.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep

      - name: Run S7 affected validation against stacked S6 base
        run: |
          git fetch origin feature/sys-users-permissions-paths
          tests/validate.sh affected \
            --base origin/feature/sys-users-permissions-paths \
            --output-dir validation-results \
            --fail-fast-preflight \
            --interactive-timeout 60 \
            --group-timeout 240 \
            --slow-timeout 300

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s7-stacked-validation
          path: validation-results/
          if-no-files-found: warn
