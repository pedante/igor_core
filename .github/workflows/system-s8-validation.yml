name: S8 Stacked Validation

on:
  push:
    branches: ["feature/sys-broader-catalogue"]

concurrency:
  group: system-s8-validation
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          pip install 'pytest>=9,<10' ruff
          sudo npm install -g bats@1.13.0
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck ripgrep

      - name: Run S8 affected validation against completed S7 base
        run: |
          git fetch origin feature/sys-network-wifi
          tests/validate.sh affected \
            --base origin/feature/sys-network-wifi \
            --output-dir validation-results \
            --fail-fast-preflight \
            --interactive-timeout 60 \
            --group-timeout 240 \
            --slow-timeout 300

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s8-stacked-validation
          path: validation-results/
          if-no-files-found: warn
