name: tmp-boundary-l-proof
on:
  push:
    branches:
      - perf/configuration-read-fast-path-boundary-l
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Syntax
        run: |
          bash -n core/lib/configuration.sh
          bash -n core/ai/core.sh
          python -m py_compile core/lib/configuration.py tests/test_configuration.py tests/test_ai_menu_startup.py
      - name: Configuration contracts
        run: |
          python -m pytest -q tests/test_configuration.py tests/test_system_configuration_workflow.py
      - name: TUI startup contracts
        run: |
          python tests/test_ai_menu_startup.py
