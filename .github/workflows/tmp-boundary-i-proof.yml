name: tmp-boundary-i-proof
on:
  push:
    branches:
      - perf/tui-startup-critical-path-boundary-i
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          bash -n igor.sh
          bash -n core/ai/core.sh
          python -m py_compile tests/test_ai_menu_startup.py core/ai/tui.py
      - name: Boundary I startup timing contract
        run: |
          python -m pytest -q tests/test_ai_menu_startup.py
