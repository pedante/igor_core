# ==============================================================================
#  IGOR — Default Configuration
#  Centralized configuration for all hardcoded values.
#  Override these in environment variables or module-specific config files.
# ==============================================================================

# ── Path Configuration ────────────────────────────────────────────────────────────
# Paths are resolved at runtime by _igor_resolve_dir (core/lib/helpers.sh) using
# IGOR_DIR as the base.  Override individual paths via environment variables:
#   IGOR_RUNTIME_DIR, IGOR_ALERTS_DIR, IGOR_BACKUPS_DIR, etc.
# Do NOT set them here with relative paths — they would override the absolute
# IGOR_DIR-anchored values that security_config.sh sets.

# ── AI Configuration ───────────────────────────────────────────────────────────────
# Default AI settings
IGOR_AI_ENABLED=true
IGOR_AI_PROVIDER="anthropic"
IGOR_AI_MODEL="claude-3-sonnet-20240229"
IGOR_AI_MODE="contextual"
IGOR_AI_TEMPERATURE=0.7
IGOR_AI_MAX_TOKENS=4096
IGOR_AI_TIMEOUT=30
IGOR_AI_RETRIES=3

# AI provider fallback
IGOR_AI_PROVIDER_FALLBACK="openrouter"

# ── System Configuration ──────────────────────────────────────────────────────────
# System limits and timeouts
IGOR_CONTEXT_MAX_SIZE=10000
IGOR_SESSION_TTL=3600
IGOR_HISTORY_SIZE=100
IGOR_CONTEXT_CACHE_TTL=300

# Health check intervals
IGOR_HEALTH_CHECK_INTERVAL=60
IGOR_HEALTH_MAX_FAILURES=3

# ── File Patterns ───────────────────────────────────────────────────────────────────
# File patterns for configuration and secrets
IGOR_CONFIG_PATTERN="*.env"
IGOR_SECRET_PATTERN="*.key"
IGOR_BACKUP_PATTERN="*.backup"

# ── Logging Configuration ───────────────────────────────────────────────────────────
IGOR_LOG_LEVEL="INFO"
IGOR_LOG_FORMAT="text"
IGOR_LOG_MAX_SIZE="10MB"
IGOR_LOG_ROTATION="5"

# ==============================================================================
#  DO NOT EDIT THIS FILE DIRECTLY
#  Override these values in environment variables or module-specific config files.
# ==============================================================================