[module]
name=nextcloud_docker
display_name=Nextcloud Docker Stack
version=1.0.0
description=Manages Nextcloud on Docker with nginx, PostgreSQL, Redis, and Cloudflare Tunnel
requires_core=1.0.0
depends_on=system
menu_section=Nextcloud Operations
menu_priority=50
menu_items=S:SETUP & INSTALL,1:STATUS,2:SERVICES,3:APPS,4:MAINTENANCE,5:CONFIGURE,6:DIAGNOSE,7:INFO

# Stack configuration — user-editable service files live in stacks/${stack_dir}/
# stack_dir is optional: modules with no user-editable config omit it (e.g. raspberrypi_system)
stack_dir=nextcloud
compose_file=docker-compose.yml
compose_project_name=nextcloud

[config]
# Non-sensitive defaults loaded by the module loader at startup.
# Canonical location: config/variables/nextcloud.env
# Install template:  modules/nextcloud_docker/defaults/nextcloud.env.example
variables_file=config/variables/nextcloud.env
secrets_files=secrets/db.env

[secrets]
variables=POSTGRES_PASSWORD,POSTGRES_USER,NC_ADMIN_PASS,NC_ADMIN_USER
scrub_patterns=POSTGRES_PASSWORD=[^[:space:]]+,NC_ADMIN_PASS=[^[:space:]]+

[panels]
panels=nc-log-tail:docker compose logs -f --tail=50:Live Nextcloud logs
panels=nc-occ-watch:watch -n5 docker compose exec app php occ status:Nextcloud status

[dependencies]
required_bins=curl
optional_bins=docker:docker.io:Docker Engine (required for container management)
required_modules=
optional_modules=system:Service management integration
