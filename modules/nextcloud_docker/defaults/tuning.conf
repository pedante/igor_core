# tuning.conf — nextcloud_docker
# Tier-conditional defaults for the Nextcloud Docker stack.
#
# Format per line:  parameter = constrained | standard | comfortable | server
# Tiers map to: constrained (<1 GB RAM), standard (1–8 GB), comfortable (8–32 GB), server (>32 GB)
#
# Each [section] maps to a config file target described in the [targets] block below.
# Igor only writes lines tagged "# igor-managed" on subsequent runs — user edits are preserved.
#
# [targets]
# postgresql = config/stacks/nextcloud/docker-compose.yml  (under POSTGRES_* env vars — not directly writable; informational only)
# redis      = config/stacks/nextcloud/docker-compose.yml  (REDIS_MAXMEMORY env var — informational only)
# php-fpm    = config/stacks/nextcloud/docker-compose.yml  (PHP_* env vars — informational only)
# nginx      = config/stacks/nextcloud/nginx.conf           (worker_processes, worker_connections)
#
# NOTE: Docker Compose env vars are not edited in-place by the tuning engine — they are
# surfaced as recommendations only (the user edits docker-compose.yml manually or via occ).
# nginx.conf IS edited directly since it is a bind-mount file Igor owns.

[postgresql]
shared_buffers = 64MB | 128MB | 256MB | 512MB
work_mem = 2MB | 4MB | 8MB | 16MB
effective_cache_size = 128MB | 256MB | 512MB | 1GB
max_connections = 20 | 50 | 100 | 200

[redis]
maxmemory = 32mb | 64mb | 128mb | 256mb

[php-fpm]
pm.max_children = 3 | 5 | 10 | 20
pm.start_servers = 1 | 2 | 3 | 5
memory_limit = 256M | 512M | 512M | 1G

[nginx]
worker_processes = 1 | 2 | auto | auto
worker_connections = 256 | 512 | 1024 | 2048
