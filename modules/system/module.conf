[module]
name=system
display_name=System Administration
version=1.0.0
description=Linux system management: services, storage, cron, and hardware monitoring
requires_core=1.0.0
depends_on=
menu_section=System
menu_priority=10
menu_items=
stack_dir=

[config]
variables_file=config/variables/system.env
secrets_files=

[dependencies]
required_bins=systemctl
optional_bins=vcgencmd:raspberrypi-utils:Raspberry Pi hardware sensors,lsblk,findmnt,udevadm

[panels]
# Quick-view panels shown in the system status dashboard
panel_1=systemctl status docker
panel_2=df -h
panel_3=free -h
